<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>{{ page.title }} | {{ site.author.name }}</title>
  <meta name="description" content="{{ page.excerpt | strip_html | strip }}">
  <link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafaf9; --surface: #ffffff; --text: #18181b; --muted: #6b6b73;
      --line: #e7e5e4; --accent: #2f5d50; --accent-soft: #e8f0ed;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111113; --surface: #1a1a1d; --text: #ededef; --muted: #9b9ba3;
        --line: #2a2a2e; --accent: #8cc4b1; --accent-soft: #1e2b27;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 400 16px/1.7 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); }
    .wrap { max-width: 700px; margin: 0 auto; padding: 0 24px; }
    nav { border-bottom: 1px solid var(--line); }
    nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 56px; }
    nav a { text-decoration: none; color: var(--text); font-weight: 600; font-size: 15px; }
    nav a.back { font-weight: 400; color: var(--muted); font-size: 14px; }
    header { padding: 64px 0 24px; }
    .label { font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin: 0 0 8px; }
    h1 { font-size: clamp(26px, 4.5vw, 34px); line-height: 1.2; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 12px; }
    .meta { color: var(--muted); font-size: 14px; margin: 0; }
    article { padding-bottom: 48px; }
    article h2 { font-size: 20px; font-weight: 600; margin: 40px 0 10px; letter-spacing: -0.01em; }
    article p, article li { margin: 0 0 14px; }
    article ul, article ol { padding-left: 22px; margin: 0 0 16px; }
    article blockquote { margin: 20px 0; padding: 4px 18px; border-left: 3px solid var(--accent); color: var(--muted); }
    article h3 { font-size: 16px; font-weight: 600; margin: 28px 0 8px; }
    article code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 13px; background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }
    article pre { background: #16181d; color: #e6e6e6; padding: 16px 18px; border-radius: 12px; overflow-x: auto; margin: 0 0 18px; line-height: 1.55; }
    article pre code { background: none; padding: 0; color: inherit; font-size: 13px; }
    article table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 0 0 18px; display: block; overflow-x: auto; }
    article th, article td { text-align: left; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
    article th { font-weight: 600; }
    .flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; margin: 8px 0 20px; }
    .flow div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
    .flow b { display: block; font-size: 13px; }
    .flow span { display: block; font-size: 12px; color: var(--muted); line-height: 1.4; }
    footer { border-top: 1px solid var(--line); padding: 28px 0 48px; font-size: 14px; color: var(--muted); }
  </style>
</head>
<body>
<nav><div class="wrap"><a href="{{ site.baseurl }}/">{{ site.author.name }}</a><a class="back" href="{{ site.baseurl }}/#writing">All writing</a></div></nav>
<main class="wrap">
  <header>
    <p class="label">Writing</p>
    <h1>{{ page.title }}</h1>
    <p class="meta">{{ page.date | date: "%d %B %Y" }}</p>
  </header>
  <article>{{ content }}</article>
</main>
<footer><div class="wrap"><a href="{{ site.baseurl }}/">Back to home</a> · <a href="https://www.linkedin.com/in/{{ site.author.linkedin }}/">LinkedIn</a></div></footer>
</body>
</html>
