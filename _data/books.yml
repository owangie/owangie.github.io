# Reading list on the home page.
- title: "Python Crash Course"
  author: "Eric Matthes"
  year: 2016
  publisher: "No Starch Press"
  url: "https://www.amazon.com/Python-Crash-Course-Eric-Matthes-ebook/dp/B09WJX22TV"
  note: "My first programming book, at 19. Still the one I recommend to anyone starting out."
- title: "Causal Inference in Python: Applying Causal Inference in the Tech Industry"
  author: "Matheus Facure"
  year: 2023
  publisher: "O'Reilly"
  url: "https://www.amazon.com/Causal-Inference-Python-Applying-Industry/dp/1098140257"
  note: "A practical guide to estimating what would have happened otherwise, with Python code."
- title: "Social capital I: measurement and associations with economic mobility"
  author: "Raj Chetty and colleagues"
  year: 2022
  publisher: "Nature 608"
  url: "https://doi.org/10.1038/s41586-022-04996-4"
  note: "What I'm reading now. It measures friendships across class from 21 billion Facebook connections and finds that knowing people richer than you is one of the strongest predictors of upward mobility. A network question, like the one in my neighbours graph, at the scale of a whole country."
