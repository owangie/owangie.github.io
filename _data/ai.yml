# "AI in my work" section of the home page.
pipeline:
  - step: "Collect"
    text: "Funding proposals, evaluation reports and GCF open data"
  - step: "Extract"
    text: "Read PDFs page by page; find sections by topic, not number"
  - step: "Ask"
    text: "One model call per question, with worked examples"
  - step: "Check"
    text: "Evidence quote required; hard rules enforced in code"
  - step: "Review"
    text: "People check a sample before the tool is used at scale"
data:
  - name: "GCF open data portal"
    url: "https://data.greenclimate.fund/public"
    text: "Project level data on approved GCF projects: financing, results areas, entities and countries."
  - name: "Funding proposal documents"
    text: "The full text of approved proposals, used for document screening."
  - name: "Evaluation reports"
    text: "Evaluation documents used for text mining and evidence synthesis."
models:
  - name: "GPT-5.4 mini"
    via: "Azure AI Foundry (inside GCF's environment)"
    use: "Screening funding proposals against evaluation criteria"
  - name: "GPT-4o"
    via: "Azure AI Foundry"
    use: "Earlier versions of document extraction work"
packages: "Python: openai, azure-identity, PyMuPDF, ijson, pandas, openpyxl. R. Power BI. Flourish for charts."
tips:
  - title: "Write the rule before the prompt"
    text: "Agree the decision rule a human reviewer would apply, and write it down as a procedure. The prompt comes after."
  - title: "Show examples, including failures"
    text: "Real passages with the right answer work better than more instructions. The best examples are the cases the model first got wrong."
  - title: "Ask for evidence"
    text: "Require a direct quotation for every answer, so a reviewer can check it in seconds."
  - title: "Let the model say unclear"
    text: "An honest unclear sends a person to the cases that need one. A forced yes or no hides them."
  - title: "Put hard rules in code"
    text: "If a rule must never be broken, check it in code after the model answers. Prompts are guidance, not guarantees."
  - title: "Budget for hidden reasoning"
    text: "Reasoning models spend part of the output limit thinking. Leave room, and detect cut off replies instead of accepting them."
  - title: "Temperature 0 is not determinism"
    text: "It reduces variation but does not remove it. Rerun a sample to see how stable the answers are."
  - title: "Keep documents inside your organisation"
    text: "Call models through your organisation's own cloud deployment rather than a public API when the text is not public."
