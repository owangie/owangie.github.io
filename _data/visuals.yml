# Charts in the Visualisations section. Titles are the question each chart answers.
- id: "27995530"
  type: scatter
  title: "Is money flowing as fast as projects age?"
  caption: "Some projects have spent nearly all their money early; others have barely moved years in. Each bubble is a project: how far through its timeline it is, against how much of its funding has gone out. Bubbles below the diagonal are spending slower than the calendar suggests. Some of that is normal start up delay, some of it is not. Which would you look at first: the big bubbles below the line, or the small ones stuck near zero?"
- id: "27526316"
  type: chart
  size: half
  title: "How big is private finance once loans are valued like grants?"
  caption: "A loan is not a gift, so counting it at face value flatters the numbers. Measured in grant equivalent terms, which count only the concessional part, the private sector share of the portfolio rose from about 5% in 2015 to about 14% by 2024, and the projection levels off around 15%. Is that a ceiling for a public climate fund, or just where it stands today?"
- id: "22701053"
  type: treemap
  size: half
  title: "Where does fast-track climate finance go?"
  caption: "The simplified approval process is meant for small, low risk projects. Adaptation dominates it: the largest block, support for the most vulnerable people and communities, is about USD 253 million, while all of mitigation fits in a thin strip. Is that by design, or do small mitigation projects struggle to find a way in?"
- id: "24566148"
  type: chart
  size: half
  title: "Which institutions receive the money?"
  caption: "Cumulative share and volume of financing commitments over time, by type of implementing institution. Who spends climate finance shapes who owns the results. If you ran the fund, how fast would you want that balance to move?"
- id: "23945772"
  type: chart
  size: half
  title: "Which part of government leads on climate finance?"
  caption: "Every country names a national focal point for the fund, and where it sits in government matters: an environment ministry and a finance ministry see climate finance very differently. Which one would you put in charge?"
- id: "20571355"
  type: map
  title: "Where does evaluation evidence come from?"
  caption: "Countries covered by evaluation missions and impact evaluations in this set. Grey countries have none. Does evaluation evidence follow need, or does it follow access? And which grey country would you study first?"
