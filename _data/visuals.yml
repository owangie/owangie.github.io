# Charts in the Visualisations section. Titles are the question each chart answers.
- id: "27995530"
  type: scatter
  title: "Is money flowing as fast as projects age?"
  caption: "Each bubble is a project: share of its timeline elapsed against share of its funding disbursed. Bubble size is the amount of financing. Projects below the diagonal are spending slower than the calendar would suggest."
- id: "27526316"
  type: chart
  size: half
  title: "How big is private finance once loans are valued like grants?"
  caption: "Measured in grant equivalent terms, which count only the concessional part of a loan, the private sector share of the portfolio rose from about 5% in 2015 to about 14% by 2024."
- id: "22701053"
  type: treemap
  size: half
  title: "Where does fast-track climate finance go?"
  caption: "Small projects approved through a simplified process, by results area. Adaptation dominates: the largest block, support for the most vulnerable people and communities, is about USD 253 million."
- id: "24566148"
  type: chart
  size: half
  title: "Which institutions receive the money?"
  caption: "Cumulative share and volume of financing commitments over time, by type of implementing institution."
- id: "23945772"
  type: chart
  size: half
  title: "Which part of government leads on climate finance?"
  caption: "The type of government office that hosts each country's national focal point for the fund."
- id: "20571355"
  type: map
  title: "Where does evaluation evidence come from?"
  caption: "Countries covered by evaluation missions and impact evaluations in this set. Grey countries have none."
