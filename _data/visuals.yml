# Charts in the Visualisations section. Titles are the question each chart answers.
- id: "27995530"
  type: scatter
  title: "Is money flowing as fast as projects age?"
  caption: "Some projects have spent nearly all their money early; others have barely moved years in. Each bubble is a project: how far through its timeline it is, against how much of its funding has gone out. Bubbles below the diagonal are spending slower than the calendar suggests. Some of that is normal start up delay, some of it is not. Which would you look at first: the big bubbles below the line, or the small ones stuck near zero?"
- id: "26622426"
  type: scatter
  title: "Do neighbours slow each other down?"
  caption: "I wondered whether projects spanning several countries, especially countries that share a border, move money more slowly. Political tension between neighbours could hold up approvals, transfers or spending. A colleague's algorithm measures how connected a project's countries are, and I plotted disbursement against maturity in four groups: single country, weak regional, strong regional and multi-regional. More of the strong regional projects, the blue dots, sit below the line than above it. It is a hypothesis, not a verdict. What would you expect: do neighbours cooperate more easily, or clash more often?"
  graph: "/assets/graphs/border-graph.html"
  graph_caption: "The neighbour graph behind the classification: 243 countries and territories as nodes, 588 shared borders as edges. Click a country to highlight its neighbours and their neighbours."
  method: "Each country is a node in a graph G, with an edge between neighbours. A project's countries are StrongRegional if they form one connected subgraph of G, WeakRegional if every country is within two steps of another, and MultiRegional otherwise. Built with networkx. <a href=\"/writing/neighbours-graph-theory/\">How it works, explained step by step</a>."
  code: |
    import networkx as nx

    def connected_within_two(G, nodes):
        for u in nodes:
            # neighbours (distance 1)
            neigh = set(G.neighbors(u))
            # neighbours of neighbours (distance 2)
            two_step = set()
            for n in neigh:
                two_step.update(G.neighbors(n))

            # candidates reachable within 2 steps
            reachable = neigh | two_step

            # check if u can reach at least one other node in the set
            if not (set(nodes) - {u}) & reachable:
                return False

        return True

    def check_connection(countries):
        if len(countries) == 1:
            return 0                      # SingleCountry

        H = G.subgraph(countries)

        if len(H) > 0 and nx.is_connected(H):
            return 1                      # StrongRegional
        elif connected_within_two(G, countries):
            return 2                      # WeakRegional
        else:
            return 999                    # MultiRegional

    project_df["Connectivity"] = project_df["Countries"].apply(check_connection)
- id: "27526316"
  type: chart
  size: half
  title: "How big is private finance once loans are valued like grants?"
  caption: "A loan is not a gift, so counting it at face value flatters the numbers. Measured in grant equivalent terms, which count only the concessional part, the private sector share of the portfolio rose from about 5% in 2015 to about 14% by 2024, and the projection levels off around 15%. Is that a ceiling for a public climate fund, or just where it stands today?"
- id: "22701053"
  type: treemap
  size: half
  title: "Where does fast-track climate finance go?"
  caption: "The simplified approval process is meant for small, low risk projects. Adaptation dominates it: the largest block, support for the most vulnerable people and communities, is about USD 253 million, while all of mitigation fits in a thin strip. Is that by design, or do small mitigation projects struggle to find a way in?"
